name: Validate GitHub Actions workflows

description: Install a pinned actionlint binary and validate the repository's GitHub Actions workflows.

inputs:
  version:
    description: actionlint release version.
    required: false
    default: "1.7.12"
  sha256:
    description: SHA-256 for the Linux amd64 release archive.
    required: false
    default: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  config-file:
    description: Path to the repository actionlint configuration file.
    required: false
    default: ".github/actionlint.yaml"

runs:
  using: composite
  steps:
    - name: Install pinned actionlint
      shell: bash
      env:
        ACTIONLINT_VERSION: ${{ inputs.version }}
        ACTIONLINT_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        install_dir="${RUNNER_TEMP}/soulmap-actionlint"
        archive="${install_dir}/actionlint.tar.gz"
        rm -rf "$install_dir"
        mkdir -p "$install_dir"
        curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
          "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
          --output "$archive"
        printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
        tar --extract --gzip --file "$archive" --directory "$install_dir"
        "$install_dir/actionlint" -version
        echo "ACTIONLINT_BIN=$install_dir/actionlint" >> "$GITHUB_ENV"

    - name: Validate workflow files
      shell: bash
      env:
        ACTIONLINT_CONFIG: ${{ inputs.config-file }}
      run: |
        set -euo pipefail
        "$ACTIONLINT_BIN" -config-file "$ACTIONLINT_CONFIG"
