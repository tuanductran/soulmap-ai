name: Install actionlint

description: Install a pinned actionlint binary without downloading a GitHub Action archive.

inputs:
  version:
    description: actionlint release version.
    required: false
    default: "1.7.12"
  sha256:
    description: SHA-256 for the Linux amd64 release archive.
    required: false
    default: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

runs:
  using: composite
  steps:
    - name: Install pinned actionlint (Linux amd64)
      shell: bash
      env:
        ACTIONLINT_VERSION: ${{ inputs.version }}
        ACTIONLINT_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        install_dir="${RUNNER_TEMP}/soulmap-actionlint"
        archive="${install_dir}/actionlint.tar.gz"
        rm -rf "$install_dir"
        mkdir -p "$install_dir"
        curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
          "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
          --output "$archive"
        printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
        tar --extract --gzip --file "$archive" --directory "$install_dir"
        echo "$install_dir" >> "$GITHUB_PATH"
        "$install_dir/actionlint" -version
