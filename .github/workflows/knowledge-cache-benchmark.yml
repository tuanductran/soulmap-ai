name: Knowledge Cache Benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/knowledge-cache-benchmark.yml"
      - "scripts/benchmark_knowledge_reads.py"
      - "tests/test_benchmark_knowledge_reads.py"
      - "src/soulmap/runtime/knowledge/keyword_lists.py"
      - "src/soulmap/runtime/knowledge/pattern_source.py"
      - "src/soulmap/runtime/source_registry.py"
      - "src/soulmap/runtime/knowledge/runtime_registry.py"
      - "src/soulmap/runtime/detectors/**"
      - "skills/frameworks/pattern-mapper.md"
      - "skills/frameworks/empath-boundary.md"
      - "skills/frameworks/ancestral-patterns.md"
      - "skills/frameworks/somatic-wellbeing.md"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/knowledge-cache-benchmark.yml"
      - "scripts/benchmark_knowledge_reads.py"
      - "tests/test_benchmark_knowledge_reads.py"
      - "src/soulmap/runtime/knowledge/keyword_lists.py"
      - "src/soulmap/runtime/knowledge/pattern_source.py"
      - "src/soulmap/runtime/source_registry.py"
      - "src/soulmap/runtime/knowledge/runtime_registry.py"
      - "src/soulmap/runtime/detectors/**"
      - "skills/frameworks/pattern-mapper.md"
      - "skills/frameworks/empath-boundary.md"
      - "skills/frameworks/ancestral-patterns.md"
      - "skills/frameworks/somatic-wellbeing.md"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * 0"

permissions:
  contents: read

concurrency:
  group: knowledge-cache-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Markdown cache correctness and benchmark
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      SOULMAP_REPO_ROOT: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          python-version: "3.11"

      - name: Install locked dependencies
        run: uv sync --locked --python 3.11

      - name: Verify cache semantics and benchmark harness
        run: uv run pytest -q tests/test_benchmark_knowledge_reads.py

      - name: Run interleaved Markdown read benchmark
        run: >-
          uv run python scripts/benchmark_knowledge_reads.py
          --warmups 3
          --iterations 30
          --output artifacts/benchmarks/markdown-reads.json

      - name: Validate benchmark report JSON
        run: |
          uv run python -m json.tool artifacts/benchmarks/markdown-reads.json > /dev/null
          test -s artifacts/benchmarks/markdown-reads.json

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soulmap-markdown-cache-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/benchmarks/markdown-reads.json
          if-no-files-found: warn
          retention-days: 30
