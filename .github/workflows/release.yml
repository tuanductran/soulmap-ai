name: Release Prep

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-prep
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    env:
      SOULMAP_REPO_ROOT: ${{ github.workspace }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.SOULMAP_RELEASE_TOKEN }}
          persist-credentials: true

      - name: Verify release token is configured
        env:
          RELEASE_TOKEN: ${{ secrets.SOULMAP_RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "SOULMAP_RELEASE_TOKEN must be configured so the automated release PR triggers normal pull_request CI."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.11"

      - name: Install dev dependencies
        run: uv sync --locked --python 3.11

      - name: Verify repository contracts and tests
        run: |
          uv run soulmap markdown-contract --root .
          uv run soulmap check-links --root .
          uv run soulmap check-case --root .
          uv run soulmap audit-knowledge
          uv run soulmap lint --skip-tests
          SOULMAP_PYTEST_SCOPE=focused uv run python scripts/pytest_diagnostics.py
          uv run soulmap eval-groups
          uv run python tests/eval_regression/test_safety_evals.py
          uv run soulmap eval-responses
          uv run soulmap eval-markdown-contracts

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch and bump version
        id: bump
        run: |
          branch="release/prep-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          uv run cz bump --yes
          uv run pymarkdown --config .pymarkdown.json fix CHANGELOG.md
          uv lock
          if ! git diff --quiet; then
            git add CHANGELOG.md uv.lock
            git commit --amend --no-edit
          fi
          version="$(uv run cz version --project)"
          {
            echo "branch=$branch"
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"

      - name: Verify bumped release tree
        run: |
          uv run soulmap markdown-contract --root .
          uv run soulmap check-links --root .
          uv run soulmap check-case --root .
          uv run soulmap release-verify --root . --output dist/release-verification.json
          uv run soulmap release-provenance --root . --verification dist/release-verification.json --provenance dist/release-provenance.json
          uv run soulmap release-health --root . --provenance dist/release-provenance.json

      - name: Push release branch
        run: |
          git push --set-upstream origin "${{ steps.bump.outputs.branch }}"

      - name: Open release pull request
        uses: $/src/action
        with:
          operation: pull-request
          token: ${{ secrets.SOULMAP_RELEASE_TOKEN }}
          branch: ${{ steps.bump.outputs.branch }}
          base: main
          tag: ${{ steps.bump.outputs.tag }}
