name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    env:
      SOULMAP_REPO_ROOT: ${{ github.workspace }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: uv sync --locked --python 3.11

      - name: Verify repository contracts and tests
        run: |
          uv run soulmap markdown-contract --root .
          uv run soulmap check-links --root .
          uv run soulmap check-case --root .
          uv run soulmap audit-knowledge
          uv run soulmap lint --skip-tests
          uv run python scripts/pytest_diagnostics.py
          uv run soulmap eval-groups
          uv run python tests/eval_regression/test_safety_evals.py
          uv run soulmap eval-responses
          uv run soulmap eval-markdown-contracts

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version + update changelog
        run: |
          uv run cz bump --yes

      - name: Normalize changelog and relock, then retag
        run: |
          uv run pymarkdown --config .pymarkdown.json fix CHANGELOG.md
          uv lock
          git add CHANGELOG.md uv.lock
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          version="$(uv run cz version --project)"
          git tag -f "v${version}"

      - name: Re-verify contracts against the bumped tree
        run: |
          uv run soulmap markdown-contract --root .
          uv run soulmap check-links --root .
          uv run soulmap check-case --root .

      - name: Verify release artifacts and integration contracts
        run: uv run soulmap release-verify --root . --output dist/release-verification.json

      - name: Record release provenance
        run: uv run soulmap release-provenance --root . --verification dist/release-verification.json --provenance dist/release-provenance.json

      - name: Verify release health
        run: uv run soulmap release-health --root . --provenance dist/release-provenance.json

      - name: Upload release operational summaries
        uses: actions/upload-artifact@v7
        with:
          name: release-operations-${{ github.run_id }}
          path: |
            dist/release-verification.json
            dist/release-provenance.json
          if-no-files-found: error
          retention-days: 14

      - name: Push bump commit + tag
        run: |
          git push --follow-tags

      - name: Resolve release version
        id: version
        run: |
          echo "version=$(uv run cz version --project)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release + upload artifacts
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: |
            dist/soulmap-ai.zip
            dist/soulmap-ai.skill
            dist/soulmap-ai-library.json
            dist/release-verification.json
            dist/release-provenance.json
