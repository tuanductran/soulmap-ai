name: Release

on: workflow_dispatch:

permissions: contents: write

concurrency: group: release cancel-in-progress: false

jobs: release: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 with:
fetch-depth: 0

```
  - uses: actions/setup-python@v5
    with:
      python-version: "3.11"
      cache: "pip"
      cache-dependency-path: |
        requirements.txt
        requirements-dev.txt

  - name: Install dev dependencies
    run: |
      python -m pip install --upgrade pip
      python -m pip install -r requirements-dev.txt

  - name: Verify repo (lint + tests)
    run: |
      python -m tools.lint

  - name: Configure git author
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "github-actions[bot]@users.noreply.github.com"

  - name: Bump version + update changelog
    run: |
      python -m commitizen bump --yes

  - name: Build distribution artifact
    run: |
      python -m tools.build_skill_zip

  - name: Push bump commit + tag
    run: |
      git push --follow-tags

  - name: Resolve release version
    id: version
    run: |
      echo "version=$(python -m commitizen version)" >> "$GITHUB_OUTPUT"

  - name: Create GitHub Release + upload zip
    uses: softprops/action-gh-release@v2
    with:
      tag_name: v${{ steps.version.outputs.version }}
      name: v${{ steps.version.outputs.version }}
      files: dist/soulmap-ai.zip
```
