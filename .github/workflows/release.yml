name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    env:
      SOULMAP_REPO_ROOT: ${{ github.workspace }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --locked --extra dev --python 3.11

      - name: Verify repo (lint + tests)
        run: |
          uv run soulmap lint
          uv run soulmap eval-groups
          uv run python tests/eval_regression/test_safety_evals.py
          uv run soulmap eval-responses
          uv run soulmap eval-markdown-contracts

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version + update changelog
        run: |
          uv run cz bump --yes

      - name: Normalize changelog markdown
        run: |
          uv run pymarkdown --config .pymarkdown.json fix CHANGELOG.md
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          version="$(uv run cz version --project)"
          git tag -f "v${version}"

      - name: Build distribution artifact
        run: |
          uv run soulmap build
          uv run soulmap build --skill

      - name: Push bump commit + tag
        run: |
          git push --follow-tags

      - name: Resolve release version
        id: version
        run: |
          echo "version=$(uv run cz version --project)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release + upload artifacts
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: |
            dist/soulmap-ai.zip
            dist/soulmap-ai.skill
