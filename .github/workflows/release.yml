name: Release Prep

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-prep
  cancel-in-progress: false

jobs:
  prepare:
    env:
      SOULMAP_REPO_ROOT: ${{ github.workspace }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.11"

      - name: Install dev dependencies
        run: uv sync --locked --python 3.11

      - name: Verify repository contracts and tests
        run: |
          uv run soulmap markdown-contract --root .
          uv run soulmap check-links --root .
          uv run soulmap check-case --root .
          uv run soulmap audit-knowledge
          uv run soulmap lint --skip-tests
          uv run python scripts/pytest_diagnostics.py
          uv run soulmap eval-groups
          uv run python tests/eval_regression/test_safety_evals.py
          uv run soulmap eval-responses
          uv run soulmap eval-markdown-contracts

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch and bump version
        id: bump
        run: |
          branch="release/prep-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          uv run cz bump --yes
          uv run pymarkdown --config .pymarkdown.json fix CHANGELOG.md
          uv lock
          if ! git diff --quiet; then
            git add CHANGELOG.md uv.lock
            git commit --amend --no-edit
          fi
          version="$(uv run cz version --project)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify bumped release tree
        run: |
          uv run soulmap markdown-contract --root .
          uv run soulmap check-links --root .
          uv run soulmap check-case --root .
          uv run soulmap release-verify --root . --output dist/release-verification.json
          uv run soulmap release-provenance --root . --verification dist/release-verification.json --provenance dist/release-provenance.json
          uv run soulmap release-health --root . --provenance dist/release-provenance.json

      - name: Push release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --set-upstream origin "${{ steps.bump.outputs.branch }}"

      - name: Open release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.bump.outputs.branch }}" \
            --title "chore(release): ${{ steps.bump.outputs.tag }}" \
            --body "Automated release preparation for ${{ steps.bump.outputs.tag }}. Merge this PR only after all required CI checks pass. The merge commit will be tagged and published by the release-finalize workflow; this workflow never writes directly to main or force-moves tags."
