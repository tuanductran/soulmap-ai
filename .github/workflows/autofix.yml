name: autofix.ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  autofix:
    env:
      SOULMAP_REPO_ROOT: ${{ github.workspace }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --locked --extra dev --python 3.11

      - name: Apply repo formatter
        run: uv run soulmap format

      - name: Push autofix changes
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
        with:
          commit-message: "style(ci): auto-apply repo formatting"
