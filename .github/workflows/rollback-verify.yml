name: Rollback Verification

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Known-good release tag to verify (for example v0.11.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rollback-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.21"
          python-version: "3.11"

      - name: Install dev dependencies
        run: uv sync --locked --python 3.11

      - name: Verify known-good release contracts
        run: |
          uv run soulmap markdown-contract --root .
          uv run soulmap check-links --root .
          uv run soulmap check-case --root .
          uv run soulmap release-verify --root . --output dist/release-verification.json

      - name: Verify release tag matches package version
        run: |
          version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${version}" = "${{ inputs.release_ref }}"

      - name: Emit rollback verification summary
        run: uv run python scripts/emit_rollback_summary.py --release-ref "${{ inputs.release_ref }}"
