name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate GitHub Actions workflows
        if: matrix.os == 'ubuntu-latest'
        uses: raven-actions/actionlint@v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Lint
        run: |
          python -m tools.lint --skip-tests
      - name: Tests
        run: |
          python -m pytest -q
      - name: Safety evals
        run: |
          python tests/test_safety_evals.py
      - name: Advanced response evals
        run: |
          python -m tools.eval_responses
      - name: Build (cross-platform smoke)
        run: |
          python -m tools.build_skill
          python -m tools.build_skill --skill
          python -m modules.markdown_contract --root .

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Build skill bundle
        run: |
          python -m tools.build_skill
          python -m tools.build_skill --skill
      - name: Verify build outputs
        run: |
          test -f dist/soulmap-ai.zip
          test -f dist/soulmap-ai.skill
      - name: Upload skill artifact
        uses: actions/upload-artifact@v6
        with:
          name: soulmap-ai-artifacts
          path: |
            dist/soulmap-ai.zip
            dist/soulmap-ai.skill
          if-no-files-found: error
