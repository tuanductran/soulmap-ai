name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    env:
      SOULMAP_REPO_ROOT: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate GitHub Actions workflows
        if: matrix.os == 'ubuntu-latest'
        uses: raven-actions/actionlint@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --locked --python 3.11
      - name: Lint
        run: uv run soulmap lint --skip-tests
      - name: Dead code detection (Vulture)
        run: uv run vulture
      - name: Dependency analysis (Deptry)
        run: uv run deptry .
      - name: Tests
        run: uv run soulmap test -n auto -q
      - name: Coverage report (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: uv run pytest -n auto --cov=src/soulmap/runtime --cov-report=term-missing -q 2>&1 | tail -20
      - name: Safety evals
        run: uv run python tests/eval_regression/test_safety_evals.py
      - name: Advanced response evals
        run: uv run soulmap eval-responses
      - name: Grouped routing and source evals
        run: uv run soulmap eval-groups
      - name: Markdown contract sync evals
        run: uv run soulmap eval-markdown-contracts
      - name: Build (cross-platform smoke)
        run: |
          uv run soulmap build
          uv run soulmap build --skill
          uv run soulmap markdown-contract --root .

  build:
    env:
      SOULMAP_REPO_ROOT: ${{ github.workspace }}
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --locked --python 3.11
      - name: Build skill bundle
        run: |
          uv run soulmap build
          uv run soulmap build --skill
      - name: Verify build outputs
        run: |
          test -f dist/soulmap-ai.zip
          test -f dist/soulmap-ai.skill
      - name: Upload skill artifact
        uses: actions/upload-artifact@v7
        with:
          name: soulmap-ai-artifacts
          path: |
            dist/soulmap-ai.zip
            dist/soulmap-ai.skill
          if-no-files-found: error
