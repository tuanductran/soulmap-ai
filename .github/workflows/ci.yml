name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    env:
      SOULMAP_REPO_ROOT: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate GitHub Actions workflows
        if: matrix.os == 'ubuntu-latest'
        uses: raven-actions/actionlint@v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Lint
        run: |
          python -m soulmap_devtools.cli.lint --skip-tests
      - name: Tests
        run: |
          python -m pytest -n auto -q
      - name: Coverage report (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pytest -n auto --cov=src/soulmap_runtime --cov-report=term-missing -q 2>&1 | tail -20
      - name: Safety evals
        run: |
          python tests/eval_regression/test_safety_evals.py
      - name: Advanced response evals
        run: |
          python -m soulmap_devtools.cli.eval_responses
      - name: Grouped routing and source evals
        run: |
          python -m soulmap_devtools.cli.eval_groups
      - name: Markdown contract sync evals
        run: |
          python -m soulmap_devtools.cli.eval_markdown_contracts
      - name: Build (cross-platform smoke)
        run: |
          python -m soulmap_devtools.cli.build_skill
          python -m soulmap_devtools.cli.build_skill --skill
          python -m soulmap_runtime.guards.markdown_contract --root .

  build:
    env:
      SOULMAP_REPO_ROOT: ${{ github.workspace }}
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Build skill bundle
        run: |
          python -m soulmap_devtools.cli.build_skill
          python -m soulmap_devtools.cli.build_skill --skill
      - name: Verify build outputs
        run: |
          test -f dist/soulmap-ai.zip
          test -f dist/soulmap-ai.skill
      - name: Upload skill artifact
        uses: actions/upload-artifact@v7
        with:
          name: soulmap-ai-artifacts
          path: |
            dist/soulmap-ai.zip
            dist/soulmap-ai.skill
          if-no-files-found: error
