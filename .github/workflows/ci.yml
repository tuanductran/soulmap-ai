name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint
        run: |
          python -m tools.lint --skip-tests
      - name: Tests
        run: |
          python -m pytest -q
      - name: Build (cross-platform smoke)
        run: |
          python -m tools.build_skill_zip
          python -m modules.package_skills
          python -m modules.markdown_contract --root .

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Build skill bundle
        run: |
          python -m tools.build_skill_zip
      - name: Verify build outputs
        run: |
          test -f dist/soulmap-ai.zip
          test -f skills/AGENTS.md
          test -f skills/AGENTS.sources.jsonl
      - name: Upload skill artifact
        uses: actions/upload-artifact@v4
        with:
          name: soulmap-ai-zip
          path: dist/soulmap-ai.zip
          if-no-files-found: error
