name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    env:
      SOULMAP_REPO_ROOT: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/actionlint

      - name: Validate GitHub Actions workflows
        if: matrix.os == 'ubuntu-latest'
        run: actionlint

      - name: Install uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: uv sync --locked --python 3.11
      - name: Lint
        run: uv run soulmap lint --skip-tests
      - name: Knowledge consistency inventory
        run: uv run soulmap audit-knowledge
      - name: Catalog parity
        run: uv run soulmap catalog-parity
      - name: Knowledge migration guard
        run: uv run soulmap audit-knowledge --max-knowledge-duplicates 519
      - name: Dead code detection (Vulture)
        run: uv run vulture
      - name: Dependency analysis (Deptry)
        run: uv run deptry .
      - name: Tests with reproducibility diagnostics
        run: uv run python scripts/pytest_diagnostics.py
      - name: Coverage report (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: uv run pytest -n auto --randomly-seed="${PYTEST_RANDOMLY_SEED}" --cov=src/soulmap/runtime --cov=src/web --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=95 -q
      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: soulmap-coverage
          path: coverage.json
          if-no-files-found: warn
      - name: Safety evals
        run: uv run python tests/eval_regression/test_safety_evals.py
      - name: Advanced response evals
        run: uv run soulmap eval-responses
      - name: Grouped routing and source evals
        run: uv run soulmap eval-groups
      - name: Markdown contract sync evals
        run: uv run soulmap eval-markdown-contracts
      - name: Build (cross-platform smoke)
        run: |
          uv run soulmap build
          uv run soulmap build --skill
          uv run soulmap build-composed --output-dir dist/soulmap-with-soulmate-ai
          uv run soulmap markdown-contract --root .
      - name: Verify composed SoulMap-Soulmate artifacts
        run: >-
          uv run python scripts/verify_soulmap_with_soulmate.py
          --zip dist/soulmap-with-soulmate-ai/soulmap-with-soulmate-ai.zip
          --skill dist/soulmap-with-soulmate-ai/soulmap-with-soulmate-ai.skill
      - name: Audit composed artifact security
        run: >-
          uv run python scripts/verify_artifact_security.py
          dist/soulmap-with-soulmate-ai/soulmap-with-soulmate-ai.zip
          dist/soulmap-with-soulmate-ai/soulmap-with-soulmate-ai.skill

  knowledge-audit:
    env:
      SOULMAP_REPO_ROOT: ${{ github.workspace }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: uv sync --locked --python 3.11
      - name: Generate knowledge inventory
        run: uv run soulmap audit-knowledge > knowledge-inventory.txt
      - name: Upload knowledge inventory
        uses: actions/upload-artifact@v7
        with:
          name: soulmap-knowledge-inventory
          path: knowledge-inventory.txt
          if-no-files-found: error

  build:
    env:
      SOULMAP_REPO_ROOT: ${{ github.workspace }}
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: uv sync --locked --python 3.11
      - name: Build Library distribution artifacts
        run: |
          uv run soulmap library-manifest
          uv run soulmap build-composed --output-dir dist/soulmap-with-soulmate-ai
      - name: Verify build outputs and SHA-256 integrity
        run: |
          test -f dist/soulmap-ai.zip
          test -f dist/soulmap-ai.skill
          test -f dist/soulmap-ai-library.json
          uv run python scripts/verify_artifact_hashes.py
      - name: Verify extracted artifact boundaries
        run: uv run python scripts/verify_extracted_artifacts.py
      - name: Run artifact security audit
        run: uv run python scripts/verify_artifact_security.py
      - name: Upload skill artifact
        uses: actions/upload-artifact@v7
        with:
          name: soulmap-ai-artifacts
          path: |
            dist/soulmap-ai.zip
            dist/soulmap-ai.skill
            dist/soulmap-ai-library.json
            dist/soulmap-with-soulmate-ai/soulmap-with-soulmate-ai.zip
            dist/soulmap-with-soulmate-ai/soulmap-with-soulmate-ai.skill
          if-no-files-found: error
