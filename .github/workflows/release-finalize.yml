name: Release Finalize

on:
  pull_request:
    types: [closed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      merge_commit_sha:
        description: "Merge commit SHA from an already-merged release/prep-* PR; dispatch is recovery-only."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-finalize
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && inputs.merge_commit_sha != '') ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/prep-'))
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.artifact_name.outputs.artifact_name }}
    env:
      SOULMAP_REPO_ROOT: ${{ github.workspace }}
    steps:
      - name: Verify recovery dispatch ref exactly matches main
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Refusing recovery dispatch outside the exact main ref."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.merge_commit_sha || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout is the merged release commit
        env:
          MERGE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.merge_commit_sha || github.event.pull_request.merge_commit_sha }}
        run: |
          test -n "$MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$MERGE_SHA" origin/main; then
            echo "Refusing to publish from a commit that is not reachable from main."
            exit 1
          fi

      - name: Verify release preparation PR provenance and changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          MERGE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.merge_commit_sha || github.event.pull_request.merge_commit_sha }}
        run: |
          gh api --paginate --slurp --header "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/pulls?per_page=100" \
            > "$RUNNER_TEMP/associated-pull-requests.json"

          matching_pr="$(jq -cer --arg sha "$MERGE_SHA" --arg repository "$GITHUB_REPOSITORY" '
            add
            | [ .[] | select(
                .merged_at != null
                and .merge_commit_sha == $sha
                and .base.ref == "main"
                and .base.repo.full_name == $repository
                and .head.repo.full_name == $repository
                and (.head.ref | startswith("release/prep-"))
              ) ]
            | if length == 1 then .[0] else error("Expected exactly one matching merged release PR") end
          ' "$RUNNER_TEMP/associated-pull-requests.json")"
          printf '%s\n' "$matching_pr" > "$RUNNER_TEMP/matching-release-pr.json"

          pr_number="$(jq -er '.number' "$RUNNER_TEMP/matching-release-pr.json")"
          head_ref="$(jq -er '.head.ref' "$RUNNER_TEMP/matching-release-pr.json")"
          case "$head_ref" in
            release/prep-[1-9][0-9]*) ;;
            *) echo "Refusing to publish: release branch is not run-ID bound."; exit 1 ;;
          esac
          run_id="${head_ref#release/prep-}"
          case "$run_id" in
            *[!0-9]*|'') echo "Refusing to publish: invalid release workflow run ID."; exit 1 ;;
          esac

          # Find retained artifacts from this exact run. The run-level API's
          # run_attempt is the latest attempt, not necessarily the attempt that
          # created the PR's manifest.
          gh api --paginate --slurp --header "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
            > "$RUNNER_TEMP/release-prep-artifacts.json"
          jq -r --argjson run_id "$run_id" '
            [
              .[].artifacts[]?
              | select(
                  .expired == false
                  and .workflow_run.id == $run_id
                  and (
                    .name
                    | test("^release-prep-provenance-" + ($run_id | tostring) + "-[1-9][0-9]*$")
                  )
                )
              | .name
            ]
            | unique
            | .[]
          ' "$RUNNER_TEMP/release-prep-artifacts.json" \
            > "$RUNNER_TEMP/release-prep-artifact-names.txt"
          mapfile -t artifact_names < "$RUNNER_TEMP/release-prep-artifact-names.txt"
          if [ "${#artifact_names[@]}" -eq 0 ]; then
            echo "Refusing to publish: no retained run-scoped provenance artifact exists."
            exit 1
          fi

          pr_head_sha="$(jq -er '.head.sha' "$RUNNER_TEMP/matching-release-pr.json")"
          selected_count=0
          selected_artifact_name=""
          selected_manifest=""
          selected_workflow_run=""
          for artifact_name in "${artifact_names[@]}"; do
            attempt="${artifact_name##*-}"
            case "$attempt" in
              *[!0-9]*|'') echo "Refusing to publish: invalid artifact attempt suffix."; exit 1 ;;
            esac
            candidate_dir="$RUNNER_TEMP/release-prep-candidates/$attempt"
            mkdir -p "$candidate_dir"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name "$artifact_name" --dir "$candidate_dir"
            candidate_manifest="$candidate_dir/release-prep-provenance.json"
            candidate_run="$candidate_dir/workflow-run.json"
            test -s "$candidate_manifest"
            gh api --header "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/attempts/${attempt}" \
              > "$candidate_run"

            if jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg release_branch "$head_ref" \
              --arg release_head_sha "$pr_head_sha" \
              --argjson run_id "$run_id" \
              --argjson attempt "$attempt" \
              --slurpfile manifest "$candidate_manifest" '
                .id == $run_id
                and .run_attempt == $attempt
                and .event == "workflow_dispatch"
                and (
                  .path == ".github/workflows/release.yml"
                  or .path == ".github/workflows/release.yml@main"
                )
                and .head_branch == "main"
                and .conclusion == "success"
                and .repository.full_name == $repository
                and .head_sha == $manifest[0].run_head_sha
                and $manifest[0].repository == $repository
                and $manifest[0].run_id == $run_id
                and $manifest[0].run_attempt == $attempt
                and $manifest[0].workflow_ref == (
                  $repository + "/.github/workflows/release.yml@refs/heads/main"
                )
                and $manifest[0].release_branch == $release_branch
                and $manifest[0].release_head_sha == $release_head_sha
              ' "$candidate_run" > /dev/null; then
              selected_count=$((selected_count + 1))
              selected_artifact_name="$artifact_name"
              selected_manifest="$candidate_manifest"
              selected_workflow_run="$candidate_run"
            fi
          done

          if [ "$selected_count" -ne 1 ]; then
            echo "Refusing to publish: expected exactly one successful attempt artifact matching the merged PR head."
            exit 1
          fi

          # The immutable run-scoped artifact is authoritative. The selected
          # attempt is established by its artifact name, manifest, and attempt API.
          # Recovery intentionally fails closed after GitHub's 90-day retention.
          manifest="$RUNNER_TEMP/release-prep-provenance.json"
          workflow_run="$RUNNER_TEMP/release-prep-workflow-run.json"
          cp "$selected_manifest" "$manifest"
          cp "$selected_workflow_run" "$workflow_run"

          # The owner-authored PR comment is only a consistency index, never the source of truth.
          gh api --paginate --slurp --header "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments?per_page=100" \
            > "$RUNNER_TEMP/release-pr-comments.json"
          workflow_sha="$(jq -er '.workflow_sha' "$manifest")"
          run_head_sha="$(jq -er '.run_head_sha' "$manifest")"
          if ! git merge-base --is-ancestor "$workflow_sha" "$run_head_sha"; then
            echo "Refusing to publish: workflow source was not in the dispatched main ref."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$run_head_sha" origin/main; then
            echo "Refusing to publish: dispatched main ref is not on current main history."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$workflow_sha" origin/main; then
            echo "Refusing to publish: Release Prep workflow source is not on main."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TRUSTED_WORKFLOW_SHA" origin/main; then
            echo "Refusing to publish: finalization workflow source is not on main."
            exit 1
          fi
          trusted_verifier="$RUNNER_TEMP/verify_release_finalize_provenance.py"
          git show "${TRUSTED_WORKFLOW_SHA}:scripts/verify_release_finalize_provenance.py" > "$trusted_verifier"
          test -s "$trusted_verifier"

          gh api --paginate --slurp --header "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files?per_page=100" \
            > "$RUNNER_TEMP/release-pr-files.json"

          # Execute the verifier from the trusted workflow revision, never from the target checkout.
          python3 "$trusted_verifier" \
            "$RUNNER_TEMP/associated-pull-requests.json" "$MERGE_SHA" \
            "$RUNNER_TEMP/release-pr-files.json" "$GITHUB_REPOSITORY" \
            "$selected_artifact_name" "$manifest" \
            "$RUNNER_TEMP/release-pr-comments.json" "$workflow_run"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.11"

      - name: Install dev dependencies
        run: uv sync --locked --python 3.11

      - name: Resolve release version
        id: version
        run: |
          version="$(uv run cz version --project)"
          {
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"

      - name: Verify merged release tree
        run: |
          uv run soulmap markdown-contract --root .
          uv run soulmap check-links --root .
          uv run soulmap check-case --root .
          uv run soulmap audit-knowledge
          uv run soulmap lint --skip-tests
          SOULMAP_PYTEST_SCOPE=focused uv run python scripts/pytest_diagnostics.py
          uv run soulmap eval-groups
          uv run python tests/eval_regression/test_safety_evals.py
          uv run soulmap eval-responses
          uv run soulmap eval-markdown-contracts

      - name: Build release artifacts
        run: uv run soulmap library-manifest

      - name: Run release verification gate
        run: uv run soulmap release-gate --root . --verification dist/release-verification.json --provenance dist/release-provenance.json

      - name: Verify release artifacts
        run: |
          test -f dist/soulmap-ai.zip
          test -f dist/soulmap-ai.skill
          test -f dist/soulmap-ai-library.json
          test -f dist/release-verification.json
          test -f dist/release-provenance.json
          uv run python scripts/verify_artifact_hashes.py
          uv run python scripts/verify_extracted_artifacts.py

      - name: Upload release artifacts for publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-finalize-${{ github.run_id }}
          path: |
            dist/soulmap-ai.zip
            dist/soulmap-ai.skill
            dist/soulmap-ai-library.json
            dist/release-verification.json
            dist/release-provenance.json
          if-no-files-found: error
          retention-days: 14

      - name: Export artifact name
        id: artifact_name
        run: echo "artifact_name=release-finalize-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Preserve verification diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-finalize-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/release-verification.json
            dist/release-provenance.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: verify
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && inputs.merge_commit_sha != '' ||
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/prep-')) &&
      needs.verify.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.merge_commit_sha || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout is the merged release commit
        env:
          MERGE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.merge_commit_sha || github.event.pull_request.merge_commit_sha }}
        run: |
          test -n "$MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$MERGE_SHA" origin/main; then
            echo "Refusing to publish from a commit that is not reachable from main."
            exit 1
          fi

      - name: Download verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: dist

      - name: Verify downloaded release artifacts
        run: |
          test -f dist/soulmap-ai.zip
          test -f dist/soulmap-ai.skill
          test -f dist/soulmap-ai-library.json
          test -f dist/release-verification.json
          test -f dist/release-provenance.json

      - name: Verify release token is configured
        env:
          RELEASE_TOKEN: ${{ secrets.SOULMAP_RELEASE_TOKEN }}
        run: |
          if [ -z "${RELEASE_TOKEN//[[:space:]]/}" ]; then
            echo "SOULMAP_RELEASE_TOKEN must be configured as a repository secret."
            exit 1
          fi

      - name: Generate release artifact attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/soulmap-ai.zip
            dist/soulmap-ai.skill
            dist/soulmap-ai-library.json

      - name: Create immutable release tag through Python action
        uses: tuanductran/soulmap-ai/src/action@dbc92c971f3ef2639000c1481c23bb62eaec720f # includes the verified remote credential scoping from #1060
        with:
          operation: tag
          token: ${{ secrets.SOULMAP_RELEASE_TOKEN }}
          tag: v${{ needs.verify.outputs.version }}
          target-sha: ${{ github.event_name == 'workflow_dispatch' && inputs.merge_commit_sha || github.event.pull_request.merge_commit_sha }}

      - name: Publish GitHub Release
        uses: tuanductran/soulmap-ai/src/action@dbc92c971f3ef2639000c1481c23bb62eaec720f
        with:
          operation: release
          token: ${{ secrets.SOULMAP_RELEASE_TOKEN }}
          tag: v${{ needs.verify.outputs.version }}
          release-name: v${{ needs.verify.outputs.version }}
          generate-release-notes: "true"
          files: |
            dist/soulmap-ai.zip
            dist/soulmap-ai.skill
            dist/soulmap-ai-library.json
            dist/release-verification.json
            dist/release-provenance.json
          draft: "false"
