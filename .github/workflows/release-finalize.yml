name: Release Finalize

on:
  pull_request:
    types: [closed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      merge_commit_sha:
        description: "Existing merged release commit SHA to finalize without another version bump."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-finalize
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.merge_commit_sha != '') ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/prep-'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.artifact_name.outputs.artifact_name }}
    env:
      SOULMAP_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.merge_commit_sha || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout is the merged release commit
        env:
          MERGE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.merge_commit_sha || github.event.pull_request.merge_commit_sha }}
        run: |
          test -n "$MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.11"

      - name: Install dev dependencies
        run: uv sync --locked --python 3.11

      - name: Resolve release version
        id: version
        run: |
          version="$(uv run cz version --project)"
          {
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"

      - name: Verify merged release tree
        run: |
          uv run soulmap markdown-contract --root .
          uv run soulmap check-links --root .
          uv run soulmap check-case --root .
          uv run soulmap audit-knowledge
          uv run soulmap lint --skip-tests
          SOULMAP_PYTEST_SCOPE=focused uv run python scripts/pytest_diagnostics.py
          uv run soulmap eval-groups
          uv run python tests/eval_regression/test_safety_evals.py
          uv run soulmap eval-responses
          uv run soulmap eval-markdown-contracts

      - name: Build release artifacts
        run: uv run soulmap library-manifest

      - name: Generate release verification
        run: uv run soulmap release-verify --root . --output dist/release-verification.json

      - name: Generate release provenance
        run: uv run soulmap release-provenance --root . --verification dist/release-verification.json --provenance dist/release-provenance.json

      - name: Run release health checks
        run: uv run soulmap release-health --root . --provenance dist/release-provenance.json

      # release-health revalidates artifacts and older release commits may remove
      # dist/release-verification.json while rebuilding them. Regenerate both
      # metadata files from the final post-health artifacts before publication.
      - name: Regenerate release verification after health checks
        run: uv run soulmap release-verify --root . --output dist/release-verification.json

      - name: Regenerate release provenance after health checks
        run: uv run soulmap release-provenance --root . --verification dist/release-verification.json --provenance dist/release-provenance.json

      - name: Verify release artifacts
        run: |
          test -f dist/soulmap-ai.zip
          test -f dist/soulmap-ai.skill
          test -f dist/soulmap-ai-library.json
          test -f dist/release-verification.json
          test -f dist/release-provenance.json
          uv run python scripts/verify_artifact_hashes.py
          uv run python scripts/verify_extracted_artifacts.py

      - name: Upload release artifacts for publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-finalize-${{ github.run_id }}
          path: |
            dist/soulmap-ai.zip
            dist/soulmap-ai.skill
            dist/soulmap-ai-library.json
            dist/release-verification.json
            dist/release-provenance.json
          if-no-files-found: error
          retention-days: 14

      - name: Export artifact name
        id: artifact_name
        run: echo "artifact_name=release-finalize-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Preserve verification diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-finalize-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/release-verification.json
            dist/release-provenance.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: verify
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.merge_commit_sha != '' ||
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/prep-')) &&
      needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.merge_commit_sha || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout is the merged release commit
        env:
          MERGE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.merge_commit_sha || github.event.pull_request.merge_commit_sha }}
        run: |
          test -n "$MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"

      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: dist

      - name: Verify downloaded release artifacts
        run: |
          test -f dist/soulmap-ai.zip
          test -f dist/soulmap-ai.skill
          test -f dist/soulmap-ai-library.json
          test -f dist/release-verification.json
          test -f dist/release-provenance.json

      - name: Generate release artifact attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/soulmap-ai.zip
            dist/soulmap-ai.skill
            dist/soulmap-ai-library.json

      - name: Configure git author for release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          fetch-depth: 1
          persist-credentials: false

      - name: Create immutable release tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.verify.outputs.version }}
          RELEASE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.merge_commit_sha || github.event.pull_request.merge_commit_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          python .release-tools/.github/python/release_tag.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: v${{ needs.verify.outputs.version }}
          files: |
            dist/soulmap-ai.zip
            dist/soulmap-ai.skill
            dist/soulmap-ai-library.json
            dist/release-verification.json
            dist/release-provenance.json
