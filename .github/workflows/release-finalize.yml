name: Release Finalize

on:
  pull_request:
    types: [closed]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: release-finalize
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/prep-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.artifact_name.outputs.artifact_name }}
    env:
      SOULMAP_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout is the merged release commit
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          test -n "$MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.11"

      - name: Install dev dependencies
        run: uv sync --locked --python 3.11

      - name: Resolve release version
        id: version
        run: |
          version="$(uv run cz version --project)"
          {
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"

      - name: Verify merged release tree
        run: |
          uv run soulmap markdown-contract --root .
          uv run soulmap check-links --root .
          uv run soulmap check-case --root .
          uv run soulmap audit-knowledge
          uv run soulmap lint --skip-tests
          uv run python scripts/pytest_diagnostics.py
          uv run soulmap eval-groups
          uv run python tests/eval_regression/test_safety_evals.py
          uv run soulmap eval-responses
          uv run soulmap eval-markdown-contracts
          uv run soulmap release-verify --root . --output dist/release-verification.json
          uv run soulmap release-provenance --root . --verification dist/release-verification.json --provenance dist/release-provenance.json
          uv run soulmap release-health --root . --provenance dist/release-provenance.json

      - name: Build release artifacts
        run: uv run soulmap library-manifest

      - name: Verify release artifacts
        run: |
          test -f dist/soulmap-ai.zip
          test -f dist/soulmap-ai.skill
          test -f dist/soulmap-ai-library.json
          uv run python scripts/verify_artifact_hashes.py
          uv run python scripts/verify_extracted_artifacts.py

      - name: Upload release artifacts for publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-finalize-${{ github.run_id }}
          path: |
            dist/soulmap-ai.zip
            dist/soulmap-ai.skill
            dist/soulmap-ai-library.json
            dist/release-verification.json
            dist/release-provenance.json
          if-no-files-found: error
          retention-days: 14

      - name: Export artifact name
        id: artifact_name
        run: echo "artifact_name=release-finalize-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

  publish:
    needs: verify
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/prep-') &&
      needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout is the merged release commit
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          test -n "$MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"

      - name: Download verified release artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: dist

      - name: Verify downloaded release artifacts
        run: |
          test -f dist/soulmap-ai.zip
          test -f dist/soulmap-ai.skill
          test -f dist/soulmap-ai-library.json
          test -f dist/release-verification.json
          test -f dist/release-provenance.json

      - name: Create immutable release tag
        env:
          TAG: v${{ needs.verify.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            existing_commit="$(git rev-parse "$TAG^{commit}")"
            if [ "$existing_commit" != "$MERGE_SHA" ]; then
              echo "Release tag $TAG exists but points to $existing_commit, expected $MERGE_SHA."
              exit 1
            fi
            echo "Release tag $TAG already exists at the exact merged commit; reusing it without moving it."
          else
            git tag -a "$TAG" -m "Release $TAG" "$MERGE_SHA"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: v${{ needs.verify.outputs.version }}
          files: |
            dist/soulmap-ai.zip
            dist/soulmap-ai.skill
            dist/soulmap-ai-library.json
            dist/release-verification.json
            dist/release-provenance.json
