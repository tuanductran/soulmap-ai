name: Website Pages

on:
  pull_request:
    paths:
      - ".github/workflows/website-pages.yml"
      - "web/**"
      - "docs/product/WEBSITE.md"
      - "README.md"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/website-pages.yml"
      - "web/**"
      - "docs/product/WEBSITE.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-pages-${{ github.repository }}
  cancel-in-progress: false

env:
  STATIC_OUTPUT: site
  STATIC_ARTIFACT: soulmap-static-site-${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install locked web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Build and verify project-site static output
        run: |
          rm -rf "${STATIC_OUTPUT}"
          SITE_BASE_PATH=/${{ github.event.repository.name }}/ pnpm --dir web build
          pnpm --dir web verify
          cp -R web/dist "${STATIC_OUTPUT}"

      - name: Upload static output for inspection
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.STATIC_ARTIFACT }}
          path: ${{ env.STATIC_OUTPUT }}
          if-no-files-found: error

  browser-audit:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies and browser
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium firefox webkit

      - name: Run browser audit
        run: |
          SITE_BASE_PATH=/${{ github.event.repository.name }}/ pnpm --dir web build
          pnpm --dir web test:browser

      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results-${{ github.sha }}
          path: web/test-results/
          if-no-files-found: warn

  publish-gh-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main for publication context
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified static output
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.STATIC_ARTIFACT }}
          path: ${{ runner.temp }}/soulmap-static-site

      - name: Publish only static files to gh-pages
        env:
          PUBLISH_DIR: ${{ runner.temp }}/soulmap-static-site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:refs/remotes/origin/gh-pages
            git switch --create gh-pages --track origin/gh-pages
          else
            git switch --orphan gh-pages
          fi

          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "${PUBLISH_DIR}/." .
          touch .nojekyll
          git add -A

          if git diff --cached --quiet; then
            echo "gh-pages is already up to date"
          else
            git commit -m "chore(site): publish ${GITHUB_SHA}"
            git push --force origin gh-pages
          fi
