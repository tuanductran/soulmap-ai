name: Weekly governance and dependency review

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  weekly-review:
    env:
      SOULMAP_REPO_ROOT: ${{ github.workspace }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install actionlint
        uses: ./.github/actions/actionlint
      - name: Validate GitHub Actions workflows
        run: actionlint -config-file .github/actionlint.yaml
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --locked --python 3.11
      - name: Audit deleted-path references and stale comment candidates
        run: uv run python scripts/audit_repo_consistency.py --history > repo-consistency-audit.txt
      - name: Run Python-owned weekly governance gate
        run: uv run soulmap weekly-governance

      - name: Upload weekly review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-governance-evidence
          path: |
            weekly-governance/uv-tree.txt
            repo-consistency-audit.txt
            dist/soulmap-ai.zip
            dist/soulmap-ai.skill
            dist/soulmap-ai-library.json
          if-no-files-found: warn
          retention-days: 30
