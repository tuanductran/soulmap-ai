name: Deploy SoulMap site

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "skills/**"
      - "SOULMAP.md"
      - "SKILL.md"
      - "pyproject.toml"
      - ".github/workflows/site-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build and validate public site
        working-directory: site
        env:
          SOULMAP_SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SOULMAP_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
