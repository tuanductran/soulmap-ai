name: Backfill Historical Release Notes

on:
  push:
    branches:
      - main

jobs:
  backfill:
    if: "contains(github.event.head_commit.message, 'backfill: historical release notes')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run one-time release note migration
        env:
          SOULMAP_RELEASE_TOKEN: ${{ secrets.SOULMAP_RELEASE_TOKEN }}
        run: python3 .github/python/backfill_release_notes.py
