name: Python Compatibility

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    env:
      SOULMAP_REPO_ROOT: ${{ github.workspace }}
      SOULMAP_PYTEST_SCOPE: focused
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run focused test suite
        run: uv run python scripts/pytest_diagnostics.py
