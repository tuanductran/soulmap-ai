pre-commit:
  parallel: false
  commands:
    ruff-check-fix:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
    ruff-format:
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    markdown-contract:
      glob: "*.md"
      run: uv run soulmap markdown-contract --root .
    markdown-links:
      glob: "*.md"
      run: uv run soulmap check-links --root . {staged_files}
    markdown-case:
      glob: "*.md"
      run: uv run soulmap check-case --root . {staged_files}
    api-docs:
      glob: "*.md"
      run: uv run soulmap check-api-docs --root .
    pymarkdown:
      glob: "*.md"
      run: uv run pymarkdown --config .pymarkdown.json scan {staged_files}

commit-msg:
  commands:
    conventional-commits:
      run: uv run cz check --commit-msg-file {1}
