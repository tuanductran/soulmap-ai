<div class="modal-dialog__header">
  <p class="eyebrow">$group</p>
  <h2 id="skill-title-$slug">$title</h2>
  <p class="lede">$summary</p>
</div>
<div class="split">
  <div>
    <h3>$use_when_label</h3>
    <p>$use_when</p>
    <h3>$best_for_label</h3>
    <p>$best_for</p>
  </div>
  <div>
    <h3>$boundary_label</h3>
    <p>$boundary</p>
    <p class="modal-note">$raw_note</p>
  </div>
</div>
<div class="cluster">
  <a class="button small" href="$raw_href" target="_blank" rel="noopener">$raw_label</a>
  <span x-data="clipboard">
    <button class="button small secondary" type="button" x-on:click="copy('$raw_url')" aria-live="polite">
      <span x-show="!copied" x-transition.opacity.duration.150ms>$copy_raw_label</span>
      <span x-show="copied" x-cloak x-transition.opacity.duration.150ms>$copied_label</span>
    </button>
  </span>
</div>
<section class="prompt-pack" aria-labelledby="prompt-pack-title-$slug">
  <h3 id="prompt-pack-title-$slug">$prompt_heading</h3>
  <p class="modal-note">$prompt_intro</p>
  <div class="prompt-scenarios">$prompt_scenarios</div>
</section>
