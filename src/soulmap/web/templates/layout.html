<!doctype html>
<html lang="$language">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="htmx-config" content='{"includeIndicatorStyles":false,"historyCacheSize":10}'>
    <meta name="view-transition" content="same-origin">
    <meta name="description" content="$description">
    <link rel="canonical" href="$canonical_url">
    <link rel="icon" href="/favicon.ico" sizes="any">
$alternate_links
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="$site_name">
    <meta property="og:title" content="$og_title">
    <meta property="og:description" content="$og_description">
    <meta property="og:url" content="$og_url">
    <meta property="og:locale" content="$og_locale">
    <meta property="og:locale:alternate" content="$og_locale_alternate">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="$og_title">
    <meta name="twitter:description" content="$og_description">
    <script id="soulmap-locale-data" type="application/json">$locale_json</script>
    <script type="application/ld+json">$json_ld</script>
    <meta name="theme-color" content="#f7f5ef" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#192322" media="(prefers-color-scheme: dark)">
    $resource_hints
    <link rel="stylesheet" href="/static/site.css">
    <script defer src="$htmx_url" integrity="$htmx_sri" crossorigin="anonymous"></script>
    <script defer src="/static/search.js"></script>
    <script defer src="/static/site.js"></script>
    <script defer src="$alpine_url" integrity="$alpine_sri" crossorigin="anonymous"></script>
    <title>$title · $site_name</title>
  </head>
  <body
    id="page-shell"
    hx-boost="true"
    hx-history-elt="body"
    hx-indicator="#page-progress"
    hx-swap="innerHTML transition:true show:top"
  >
    <div id="page-progress" class="page-progress htmx-indicator" role="status" aria-live="polite" aria-label="$loading_label"></div>
    <a class="skip-link" href="#main-content">$skip_label</a>
    $nav
    <main id="main-content">$content</main>
    $footer
  </body>
</html>
