default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort

  - repo: local
    hooks:
      - id: markdown-contract
        name: Markdown contract
        entry: python -m modules.markdown_contract --root .
        language: system
        pass_filenames: false
        files: \.md$
      - id: pymarkdown
        name: PyMarkdown
        entry: python -m pymarkdown --config .pymarkdown.json scan
        language: system
        files: \.md$
      - id: conventional-commits
        name: Conventional Commits (commitizen)
        entry: python -m commitizen check --commit-msg-file
        language: system
        stages: [commit-msg]
