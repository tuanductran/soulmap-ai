repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-case-conflict

  # Conventional Commits enforcement (commit message lint).
  # Install with: pre-commit install --hook-type commit-msg
  - repo: local
    hooks:
      - id: conventional-commits
        name: Conventional Commits (commitizen)
        entry: python -m commitizen check --commit-msg-file
        language: system
        stages: [commit-msg]
