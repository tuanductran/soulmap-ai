[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soulmap-ai"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "mdformat==0.7.21",
  "ruff==0.15.5",
  "isort==7.0.0",
  "pymarkdownlnt==0.9.36",
  "pre-commit==4.5.1",
  "pytest==9.0.2",
  "pyright==1.1.408",
  "commitizen==4.13.7",
]

[tool.setuptools]
packages = ["modules", "tools"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
force_sort_within_sections = true
known_first_party = ["modules", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
  ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["modules", "tests", "tools", "scripts"]
exclude = [
  ".venv",
  ".pytest_cache",
  ".ruff_cache",
  "dist",
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
]
reportMissingTypeStubs = false

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
