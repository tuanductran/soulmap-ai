[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soulmap-ai"
version = "0.4.0"
description = "SoulMap AI knowledge base, orchestration modules, and local developer tooling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff==0.15.8",
  "isort==8.0.1",
  "pymarkdownlnt==0.9.36",
  "pre-commit==4.5.1",
  "pytest==9.0.2",
  "pytest-cov==7.1.0",
  "pyright==1.1.408",
  "commitizen==4.13.9",
]

[tool.setuptools]
packages = ["modules", "modules.config", "tools"]

[tool.isort]
profile = "black"
line_length = 88
force_sort_within_sections = true
known_first_party = ["modules", "scripts", "tests", "tools"]
src_paths = ["modules", "scripts", "tests", "tools"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
  ".venv",
  ".pre-commit-cache",
  ".pytest_cache",
  ".ruff_cache",
  "__pycache__",
  "dist",
  "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["modules"]
omit = ["modules/soulmap_demo.py", "modules/biometric_ingest.py", "modules/memory_ledger.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise SystemExit",
]
show_missing = true

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["modules", "tests", "tools", "scripts"]
exclude = [
  ".venv",
  ".pytest_cache",
  ".ruff_cache",
  "dist",
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
]
reportMissingTypeStubs = false

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
