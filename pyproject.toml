[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "soulmap-ai"
version = "0.5.1"
description = "SoulMap AI knowledge base, orchestration runtime, and local developer tooling."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
soulmap = "soulmap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soulmap"]

[tool.hatch.build.targets.sdist]
include = [
  "/AGENTS.md",
  "/SKILL.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/.claude",
  "/.claude-plugin",
  "/.github",
  "/docs",
  "/evals",
  "/scripts",
  "/skills",
  "/src",
  "/templates",
  "/tests",
]

[dependency-groups]
dev = [
  "hypothesis==6.155.7",
  "ruff==0.15.19",
  "lefthook==2.1.9",
  "pymarkdownlnt==0.9.38",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
  "pyright==1.1.410",
  "commitizen==4.16.4",
  "deptry>=0.25.1",
  "vulture>=2.16",
]

[tool.ruff]
target-version = "py311"
line-length = 88
force-exclude = true
extend-exclude = [
  ".venv",
  ".pytest_cache",
  ".ruff_cache",
  "__pycache__",
  "dist",
  "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.coverage.run]
source = ["src/soulmap/runtime"]
branch = true
omit = [
  "src/soulmap/runtime/experimental/soulmap_demo.py",
  "src/soulmap/runtime/experimental/biometric_ingest.py",
  "src/soulmap/runtime/memory/memory_ledger.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise SystemExit",
]
show_missing = true

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["src", "tests", "scripts"]
exclude = [
  ".venv",
  ".pytest_cache",
  ".ruff_cache",
  "dist",
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
]
reportMissingTypeStubs = false

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true

[tool.deptry]
known_first_party = ["soulmap"]

[tool.vulture]
paths = ["src", "tests"]

min_confidence = 80

exclude = [
  ".venv/",
  ".git/",
  "dist/",
  "build/",
  "__pycache__/",
  ".pytest_cache/",
  ".ruff_cache/",
  ".mypy_cache/",
]

ignore_names = [
  "main",
]
