[project]
name = "soulmap-ai"
version = "0.2.0"
requires-python = ">=3.11"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
force_sort_within_sections = true
known_first_party = ["modules", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
  ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
